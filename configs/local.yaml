# Laptop profile (WSL2 · GTX 1660 Ti 6 GB · i7-10750H 12 threads): the episodes already
# downloaded -> clean single-speaker clips -> private Hugging Face dataset.
#
#   python -m egyspeech.cli run --stage local --config configs/local.yaml --limit 5
#
# Everything not set here comes from config.yaml.
extends: config.yaml

work_dir: /mnt/g/EgySpeech/work            # G:\EgySpeech\work on Windows (the review page is opened from there)

envs:
  conda_dir: ${HOME}/miniconda3

download:
  dir: /mnt/g/VoiceAgent/downloads_full    # used in place (nothing is copied); NA/ = videos without a playlist

segmentation:
  workers: 6                               # parallel episodes (CPU)
  memory_gb: 4.5                           # WSL's default RAM is ~7.7 GB; raise to 9 after giving WSL 12 GB

quality:
  workers: 6                               # DNSMOS processes next to UTMOS on the GPU
  batch_size: 16                           # 6 GB GPU

hub:
  chunks_repo_id: MohammedAly22/EgySpeech-V1

# ============================================================================
# EgySpeech pipeline configuration
# Every step reads this file. Paths may use ${ENV_VAR}.
# All steps are resumable: finished videos/chunks are skipped on re-runs.
# ============================================================================

# ---------------------------------------------------------------- paths ----
work_dir: ${EGYSPEECH_DATA:-/workspace/egyspeech_data}   # everything the pipeline writes
links_file: links.txt          # YouTube playlist / video / channel URLs, one per line (# comments ok)
                                # relative paths are resolved against the repo root

# conda envs each step runs in (created by scripts/install.sh)
envs:
  conda_dir: ${CONDA_DIR:-/workspace/miniforge3}
  main: egyspeech
  nemo: egyspeech-nemo
  qwen: egyspeech-qwen

# ------------------------------------------------------------- download ----
download:
  dir: null                     # episodes folder; null = <work_dir>/raw_download. Any folder of
                                # "<title> [<video id>].flac" files works (subfolders = playlists)
  audio_format: flac            # yt-dlp converts the best audio stream to this...
  sample_rate: 24000            # ...at this rate...
  channels: 1                   # ...mono
  min_video_sec: 60             # skip very short videos
  max_video_sec: 21600          # skip > 6 h (livestream dumps)
  skip_live: true
  retries: 10

# ---------------------------------------------------------------- index ----
index:
  extensions: [flac, wav, mp3, m4a, opus, ogg, webm]
  min_age_sec: 120              # skip files modified in the last 2 min (still being downloaded)

# ----------------------------------------------------------- separation ----
# Removes music and sound effects (vocal stem). Clean talk podcasts do not need it:
# music intros are rejected by the quality filter (DNSMOS BAK) anyway.
separation:
  mode: never                   # never | auto (separate only episodes where a probe finds music) | always
  model: mel_band_roformer_kim_ft_unwa.ckpt   # any audio-separator vocal model filename
  use_autocast: true            # half-precision separation on GPU (much faster)
  probe_windows: 6              # auto mode: windows checked per episode (intro / outro skipped)
  probe_window_sec: 10
  use_original_below_music_db: -35.0          # music below this level (dB rel. to speech) = no music: keep the original audio

# ---------------------------------------------------------- diarization ----
diarization:
  model: nvidia/diar_streaming_sortformer_4spk-v2.1   # NeMo Streaming Sortformer (<= 4 speakers per file)
  # "very high latency" streaming preset = best offline accuracy (units: 80 ms frames)
  chunk_len: 340
  chunk_right_context: 40
  fifo_len: 40
  spkcache_update_period: 300
  spkcache_len: 188
  speaker_threshold: 0.5        # frame belongs to a speaker above this probability
  other_speaker_threshold: 0.2  # ...and every other speaker must be below this (no overlap)

# ------------------------------------------------------------ segmentation ----
segmentation:
  min_sec: 5.0                  # TTS-friendly clip length
  max_sec: 30.0
  target_sec: 14.0              # preferred length when several cut plans are possible
  vad_threshold: 0.5            # Silero VAD speech probability
  vad_off_threshold: 0.35       # below this = pause
  min_pause_sec: 0.2            # shortest pause usable as a cut point (>= 0.1 s of silence on each side)
  strong_pause_sec: 0.4         # pauses this long are preferred cut points
  allow_weak_cuts: false        # true = long turns without pauses may be cut at energy dips (not silence)
  max_internal_silence_sec: 1.5 # a longer pause splits the turn (no long silences inside a clip)
  guard_sec: 0.15               # distance kept from any other speaker's speech (diarization timing slack)
  edge_pad_sec: 0.15            # silence kept before the first / after the last word
  loudness_lufs: -20.0          # loudness normalization target (ITU-R BS.1770), per clip
  peak_dbfs: -1.0               # peak ceiling after normalization
  fade_ms: 5                    # short fade in / out (no clicks at the clip edges)
  audio_format: flac            # clip format (lossless)
  vad_streams: 16               # Silero VAD runs each episode as this many parallel streams (~3x faster)
  workers: 8                    # parallel videos (CPU)
  memory_gb: 24                 # RAM shared by the workers (a 4 h episode needs ~2.5 GB)

# ------------------------------------------------------------- storage ----
# ~1,800 h of episodes as FLAC: ~300 GB; clips before filtering: ~60-70% of that.
storage:
  delete_vocals_after_segment: false   # frees the vocal stems (re-segmenting then needs `separate` again)
  delete_rejected_clips: false         # remove audio of clips that fail the quality filter

# -------------------------------------------------------------- quality ----
quality:
  workers: 8                    # DNSMOS CPU processes (one thread each)
  batch_size: 32                # UTMOS batch (GPU)
  speaker_window_sec: 3.0       # TitaNet windows for the single-speaker check
  speaker_hop_sec: 1.5

# ---------------------------------------------------------------- filter ----
# Scores are cached: change thresholds and re-run `filter` (seconds).
filter:
  # Strict: no bad clip may pass (tuned on the 5-video pilot by listening: 483 clips -> 233 kept;
  # every clip labeled bad - noise up to BAK 3.47, music, effects, interruption - is rejected with margin).
  min_dnsmos_ovrl: 3.0          # overall quality
  min_dnsmos_sig: 3.3           # speech distortion
  min_dnsmos_bak: 3.7           # background noise / music / effects (noisy pilot clips scored up to 3.47)
  min_utmos: 2.2                # naturalness
  min_window_similarity: 0.75   # every 3 s window must match the clip's voice: catches a second speaker
  max_clip_ratio: 0.001         # fraction of clipped samples
  min_speech_ratio: 0.55        # speech / clip duration
  drop_weak_cuts: false         # true = keep only clips cut at real pauses
  max_edge_db: -5.0             # loudest 10 ms at each clip edge vs. the speech level: clear speech at the cut

# --------------------------------------------------------- transcription ----
transcription:
  backend: qwencleo             # qwencleo | cohere | parakeet | llm
  batch_size: 16
  language: Arabic              # qwencleo: "Arabic" or null (auto); cohere: uses "ar"
  qwencleo:
    model: mohammedaly22/QwenCleo-ASR
  cohere:
    model: CohereLabs/cohere-transcribe-arabic-07-2026
  parakeet:
    model: nvidia/stt_ar_fastconformer_hybrid_large_pcd_v1.0   # any NeMo ASR checkpoint
  llm:
    url: http://localhost:8000/v1           # OpenAI-compatible endpoint (vLLM)
    model: Qwen/Qwen3-Omni-30B-A3B-Instruct
    api_key: EMPTY
    concurrency: 32
    temperature: 0.0
    max_tokens: 1024
    use_tags: true                          # insert paralinguistic tags inside the transcript
    system_prompt: |
      You are an expert transcriber of Egyptian Arabic (Masri) speech.
      Transcribe the audio verbatim, exactly as spoken, in Egyptian Arabic orthography.
      Rules:
      - Write Egyptian dialect words as they are pronounced (e.g. عايز، ازاي، دلوقتي، مش، بقى), never convert to Modern Standard Arabic.
      - Write English (or other Latin-script) words in Latin script exactly as spoken, e.g. "الـ meeting بتاعنا كان very productive".
      - Keep fillers and hesitations that are spoken (يعني، اه، امم، ايوه) and repeated words.
      - Write numbers as words, the way they are spoken.
      - Do not add diacritics, do not translate, do not summarize, do not add explanations.
      - Use only these punctuation marks: ، . ؟ !
      Output ONLY the transcript text.
    tags_prompt: |
      Also mark non-verbal and paralinguistic events INSIDE the transcript, at the exact position where they happen,
      using ONLY these tags: {tags}.
      Span tags wrap the words they apply to, e.g. [whispering] كلام [/whispering].
      Use a tag only when the event is clearly audible; never invent events. If there is none, use no tag.
  tags:
    events: [laughs, chuckles, sighs, breath, gasps, coughs, clears_throat, sniffs, lip_smack, pause]
    spans: [whispering, laughing_speech, shouting]
    styles: [excited, happy, sad, angry, calm, surprised, sarcastic, friendly, serious]   # at most one, at the start
  # Optional second transcription for agreement filtering (null = off)
  verify:
    backend: null               # e.g. cohere
    max_cer: 0.25               # drop clips whose two transcripts differ more (after normalization)
  sanity:
    min_chars_per_sec: 4.0      # catch empty / truncated transcripts
    max_chars_per_sec: 28.0     # catch hallucinated / looping transcripts
    min_arabic_ratio: 0.5       # letters that are Arabic (drops mostly-English clips)

# ------------------------------------------------------------ alignment ----
alignment:
  model: MahmoudAshraf/mms-300m-1130-forced-aligner   # MMS CTC, romanized (uroman) -> works for Arabic + English
  batch_size: 16
  min_score: -3.0               # mean per-character log-prob; lower = transcript/audio mismatch
  min_edge_sec: 0.03            # first word must start / last word must end at least this far from the clip edge

# ------------------------------------------------------------- speakers ----
speakers:
  embedding_model: nvidia/speakerverification_en_titanet_large
  merge_similarity: 0.65        # cosine similarity to merge per-video speakers into one global speaker
  gender_model: alefiury/wav2vec2-large-xlsr-53-gender-recognition-librispeech
  gender_samples: 8             # clips classified per global speaker

# ------------------------------------------------------------- balancing ----
balance:
  max_hours_per_speaker: 8.0    # cap per global speaker
  max_speaker_share: 0.03       # ... and at most this share of the whole dataset
  target_total_hours: null      # stop at this size (null = keep everything that passes)
  test_speakers: 20             # unseen speakers held out for the test split
  test_max_minutes_per_speaker: 5
  validation_fraction: 0.005    # seen-speaker validation clips

# --------------------------------------------------------------- analysis ----
analysis:
  topic_clusters: 12
  embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  save_png: true                # also export PNGs (needs Chrome for kaleido; HTML is always saved)

# ------------------------------------------------------------------ hub ----
# push_chunks / pull_chunks: the filtered clips (before transcription) as a Hugging Face dataset
hub:
  chunks_repo_id: your-username/egyspeech-chunks
  private: true
  shard_mb: 500                 # audio per Parquet shard (whole videos per shard)
  shards_per_commit: 4          # shards uploaded per commit (also the local disk needed: ~2 GB)

# --------------------------------------------------------------- publish ----
publish:
  enabled: false                # set true to push to the Hugging Face Hub
  repo_id: your-username/egyptian-arabic-speech
  private: true                 # private until you decide to release
  max_shard_size: 500MB

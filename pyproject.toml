[project]
name = "egyspeech"
version = "0.1.0"
description = "Pipeline to build a large, clean, single-speaker-per-clip Egyptian Arabic speech dataset for TTS"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["egyspeech*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
